# Catálogo unificado — POC Home Assistant. GERADO por scripts/build_catalog.py.
# Não edite os blocos `kind: Domain` diretamente: eles são reconstruídos a partir de
# CONTEXT-MAP.md + docs/dominio/*/CONTEXT.md (fonte editável, mantida pela skill
# blueprintfy). Os blocos `System`/`Component` continuam editados à mão aqui — ver
# README.md ("Como atualizar").
# Formato: Backstage catalog-info.yaml (backstage.io/v1alpha1), adaptado com campos
# custom: spec.scope, spec.repository.*, spec.subdomain (Component) e
# spec.glossary/spec.realizedBy/spec.source (Domain). Ver README.md.
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: automation-state-engine
  description: mantém o estado da casa e reage a mudanças através de automações; núcleo diferenciador
    do produto
spec:
  owner: home-assistant
  dependsOn:
  - integration-platform
  realizedBy:
  - core
  source: docs/dominio/automation-state-engine/CONTEXT.md
  glossary:
  - term: State
    definition: 'A informação de interesse de uma entidade em um dado momento (ex.: se uma
      luz está ligada, a temperatura atual).'
  - term: State Machine
    definition: O registro central que guarda o estado de todas as entidades do sistema; toda
      mudança de estado passa por ele e dispara um Event correspondente.
  - term: Entity
    definition: Um sensor, atuador ou função representada no sistema — o bloco fundamental
      que guarda dados e possui um estado. Normalmente pertence a um Device.
  - term: Event
    definition: 'O que é emitido sempre que algo acontece no sistema (ex.: toda mudança de
      estado gera um evento); mecanismo pelo qual outras partes do sistema reagem a mudanças.'
  - term: Trigger
    definition: 'O conjunto de condições que, quando satisfeitas, faz uma Automation começar
      a rodar (ex.: um horário, uma mudança de estado).'
  - term: Condition
    definition: Parte opcional de uma Automation que impede a Action de ser executada se não
      for satisfeita, mesmo com o Trigger disparado.
  - term: Action
    definition: O que é executado quando uma Automation dispara — interage com alvos (dispositivos,
      entidades) para fazer algo acontecer.
    avoid: Service (termo antigo, substituído por Action).
  - term: Automation
    definition: Conecta um ou mais Triggers a uma ou mais Actions, no formato "quando X, então
      faça Y", com Conditions opcionais no meio.
  - term: Script
    definition: Uma sequência de Actions executada quando acionada manualmente ou chamada
      por outra automação — difere de Automation por não ter Trigger próprio.
  - term: Scene
    definition: 'Uma configuração predefinida de estados desejados para um conjunto de entidades
      (ex.: "modo cinema" ajusta luzes, TV e persianas de uma vez).'
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: integration-platform
  description: conecta o sistema a dispositivos e serviços externos, dando escala ao que o
    Automation Engine enxerga e controla
spec:
  owner: home-assistant
  sharesContractWith:
  - domain: automation-state-engine
    contract: Entity
  realizedBy:
  - core
  source: docs/dominio/integration-platform/CONTEXT.md
  glossary:
  - term: Integration
    definition: Software que conecta o sistema a um dispositivo, serviço ou plataforma externa;
      é a origem de todas as Entities e Actions disponíveis no sistema.
  - term: Domain
    definition: 'O identificador único de uma Integration (ex.: `light`, `scene`) — namespace
      que prefixa todo Entity ID pertencente àquela integração.'
  - term: Device
    definition: 'Uma unidade física ou lógica que agrupa uma ou mais Entities (ex.: uma central
      multissensor que expõe temperatura, umidade e bateria como entidades separadas).'
  - term: Config Entry
    definition: A configuração de uma instância ativa de uma Integration, fornecida pelo usuário
      via fluxo de configuração.
  - term: Platform
    definition: Um bloco de construção que uma Integration disponibiliza para ser usado por
      outras integrações.
  - term: Area
    definition: Agrupamento lógico de Devices e Entities que corresponde a um cômodo/espaço
      físico da casa — permite direcionar ações a um cômodo inteiro de uma vez.
  - term: Zone
    definition: Uma região geográfica definida em um mapa (não um cômodo) usada para detecção
      de presença e disparo de automações por localização.
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: addon-system-management
  description: 'gerencia o ciclo de vida do sistema em si: add-ons, backups, updates, saúde
    do host'
spec:
  owner: home-assistant
  dependsOn:
  - automation-state-engine
  realizedBy:
  - supervisor
  - operating-system
  source: docs/dominio/addon-system-management/CONTEXT.md
  glossary:
  - term: Home Assistant Supervisor
    definition: O componente que orquestra add-ons, atualizações e backups do sistema — a
      camada de gestão que roda ao lado do core, cuidando do ciclo de vida do que roda na
      instalação.
    avoid: Hass.io (nome legado).
  - term: Add-on
    definition: 'Uma aplicação containerizada que estende as capacidades do sistema (ex.:
      um servidor MQTT, um banco de dados), instalada e gerenciada pelo Supervisor, fora do
      processo do core.'
  - term: Add-on Store
    definition: A vitrine onde o usuário descobre e instala add-ons, alimentada por um ou
      mais Repositórios de Add-ons.
  - term: Repositório de Add-ons
    definition: Uma fonte (git) de definições de add-ons que qualquer pessoa pode publicar
      e que o usuário adiciona à Add-on Store para expandir o catálogo disponível.
  - term: Ingress
    definition: A capacidade de acessar a interface de um add-on através do próprio sistema,
      sem precisar expor portas adicionais na rede.
  - term: Backup
    definition: Um ponto de restauração do sistema (configuração, add-ons, dados) que o usuário
      cria manualmente ou por agendamento.
    avoid: Snapshot (nome legado, ainda usado pela comunidade).
  - term: Update Channel
    definition: O nível de estabilidade que o usuário escolhe para receber atualizações —
      Stable (padrão), Beta (pré-lançamento) ou Dev (desenvolvimento contínuo, instável).
  - term: Host
    definition: O sistema operacional subjacente (tipicamente Home Assistant OS) sobre o qual
      o Supervisor e seus containers rodam.
  - term: Hardware Passthrough
    definition: A capacidade de um add-on ou do core acessar dispositivos físicos conectados
      ao host (USB, GPIO, Bluetooth) através de permissões concedidas pelo Supervisor.
  - term: Watchdog
    definition: Mecanismo de auto-recuperação que monitora componentes críticos e reinicia/reverte
      automaticamente quando detecta falha, sem intervenção do usuário.
  - term: Home Assistant OS
    definition: A distribuição Linux dedicada, minimalista, construída para rodar o Supervisor
      e os containers do sistema em hardware dedicado — não é de uso geral.
  - term: Boot Slot
    definition: Uma de duas partições de sistema (A/B) mantidas pelo Home Assistant OS para
      atualizações seguras — a atualização é escrita no slot inativo, e o boot só migra definitivamente
      para ele se for bem-sucedido; falhas revertem automaticamente.
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: client-experience
  description: 'como o usuário vê e controla o lar: web, mobile, voz, wearables'
spec:
  owner: home-assistant
  sharesContractWith:
  - domain: automation-state-engine
    contract: State
  - domain: integration-platform
    contract: Entity
  realizedBy:
  - frontend
  - android
  - ios
  source: docs/dominio/client-experience/CONTEXT.md
  glossary:
  - term: Dashboard
    definition: A tela principal de controle e visualização do lar — mostra o estado atual
      dos dispositivos e ambientes e permite agir sobre eles com um toque. Superfície de interação
      primária do produto, disponível em web, mobile e wearables.
  - term: View
    definition: 'Uma seção/aba dentro de um Dashboard que organiza o conteúdo por perspectiva
      de uso (ex.: uma view para a cozinha, outra para visitantes). Um Dashboard tem uma ou
      mais Views.'
  - term: Card
    definition: O componente visual individual dentro de uma View que exibe um dado ou expõe
      um controle. É a unidade de composição da interface.
  - term: Companion App
    definition: 'O aplicativo móvel oficial (Android/iOS) que estende a experiência do produto
      ao smartphone: leva o Dashboard para o bolso e adiciona capacidades exclusivas do dispositivo
      móvel (localização, widgets, notificações).'
    avoid: '"app mobile", "cliente móvel".'
  - term: Push Notification
    definition: Um alerta enviado pelo lar ao dispositivo móvel do usuário fora do app, que
      além de exibir uma mensagem pode carregar um comando que dispara uma ação no próprio
      dispositivo.
  - term: Assist
    definition: 'O assistente de voz do produto: permite controlar o lar por linguagem natural,
      com a capacidade de rodar inteiramente no hardware do próprio usuário, preservando a
      privacidade dos comandos.'
    avoid: '"voice assistant" genérico — Assist é o nome do produto.'
  - term: Widget
    definition: Um bloco de informação ou controle rápido exibido fora do app, direto na tela
      inicial do dispositivo móvel.
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: build-distribution
  description: entrega os demais componentes ao usuário de forma consistente entre arquiteturas
    de hardware
spec:
  owner: home-assistant
  realizedBy:
  - docker
  source: docs/dominio/build-distribution/CONTEXT.md
  glossary:
  - term: Base Image
    definition: A imagem de container fundamental (runtime + dependências de sistema) sobre
      a qual as imagens distribuídas do produto (core, add-ons) são construídas.
  - term: Container Image
    definition: O pacote de distribuição executável de um componente do produto, publicado
      em um registro e versionado por release — é a unidade que o usuário final baixa e executa.
  - term: Release Channel
    definition: 'A trilha de estabilidade que um usuário escolhe para receber atualizações
      (ex.: stable vs. beta).'
  - term: Multi-arch Build
    definition: A capacidade do produto de ser distribuído para diferentes arquiteturas de
      hardware a partir da mesma base de código, sem exigir que o usuário saiba qual arquitetura
      escolher.
---
apiVersion: backstage.io/v1alpha1
kind: System
