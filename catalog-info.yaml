  name: home-assistant
  description: 'Ecossistema distribuído Home Assistant: backend, frontend, supervisor de add-ons,
    sistema operacional dedicado, imagens Docker base e apps clientes móveis.'
spec:
  owner: home-assistant
  domains:
  - automation-state-engine
  - integration-platform
  - addon-system-management
  - client-experience
  - build-distribution
---
